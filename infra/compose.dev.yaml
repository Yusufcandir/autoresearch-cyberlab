# Development databases only. Ports bind to localhost so they are not exposed to the network.
# Run from the repo root: docker compose -f infra/compose.dev.yaml --env-file .env up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyberlab
      POSTGRES_DB: cyberlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberlab"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
