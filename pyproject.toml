[project]
name = "autoresearch-cyberlab"
version = "0.1.0"
description = "Secure, reproducible multi-agent research platform (AI for cybersecurity pilot)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.32",
    "xgboost>=3.4.1",
]

[project.scripts]
cyberlab = "cyberlab_common.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261111",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/common/cyberlab_common",
    "packages/authz/cyberlab_authz",
    "packages/schemas/cyberlab_schemas",
    "services/api/cyberlab_api",
    "services/llm_gateway/cyberlab_llm",
    "services/literature/cyberlab_literature",
    "services/data_registry/cyberlab_data",
    "services/protocol_compiler/cyberlab_protocol",
    "services/execution_broker/cyberlab_exec",
    "services/scientific_qa/cyberlab_qa",
    "services/evidence_service/cyberlab_evidence",
    "services/manuscript_builder/cyberlab_manuscript",
    "services/orchestrator/cyberlab_orchestrator",
    "plugins/text_tabular/cyberlab_tabular",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
# E501: the formatter owns line length; B008: FastAPI Depends idiom; S101: asserts as invariants.
ignore = ["E501", "B008", "N818", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["cyberlab_*"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
# Fixed, absolute-path subprocess calls (nvidia-smi, git, the runner module).
"services/execution_broker/**" = ["S603", "S607"]
"packages/common/cyberlab_common/doctor.py" = ["S603"]
"packages/common/cyberlab_common/gpu_baseline.py" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages", "services", "plugins"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "xgboost.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
