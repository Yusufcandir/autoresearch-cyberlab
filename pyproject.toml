[project]
name = "autoresearch-cyberlab"
version = "0.1.0"
description = "Secure, reproducible multi-agent research platform (AI for cybersecurity pilot)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn>=0.32",
]

[project.scripts]
cyberlab = "cyberlab_common.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/common/cyberlab_common",
    "packages/authz/cyberlab_authz",
    "services/api/cyberlab_api",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.isort]
known-first-party = ["cyberlab_common", "cyberlab_api", "cyberlab_authz"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
