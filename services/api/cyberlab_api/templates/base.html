<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CyberLab{% endblock %} · AutoResearch-CyberLab</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#e4e3de;--accent:#2f5bd3;
--proposed:#7a5af8;--running:#d08b00;--measured:#0b7a75;--verified:#1f8a3b;--unverified:#c2410c;--blocked:#c42b2b;--approved:#2f5bd3}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--panel:#1f1f1d;--text:#ecebe6;--muted:#a3a29b;--line:#34332f;--accent:#7d9cf0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
header a{color:var(--text);text-decoration:none;font-weight:600}header nav{margin-left:auto;display:flex;gap:16px}header nav a{font-weight:400;color:var(--muted)}
main{max-width:1180px;margin:0 auto;padding:24px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:0 0 16px}
h1{font-size:24px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}.num{font-variant-numeric:tabular-nums;text-align:right}
.label{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.Proposed{background:var(--proposed)}.Running{background:var(--running)}.Measured{background:var(--measured)}
.Verified{background:var(--verified)}.Unverified{background:var(--unverified)}.Blocked{background:var(--blocked)}.Approved{background:var(--approved)}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
input,textarea,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
textarea{min-height:110px}label{display:block;margin:10px 0 4px;font-weight:500}
button,.btn{display:inline-block;padding:8px 14px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;cursor:pointer;text-decoration:none}
button.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}button.danger{background:var(--blocked)}
.gate{border-left:4px solid var(--approved)}.error{color:var(--blocked)}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;max-height:520px;overflow:auto;font-size:13px}
details summary{cursor:pointer;font-weight:600}
@media (max-width:640px){header{flex-wrap:wrap}main{padding:16px}}
</style>
</head>
<body>
<header>
  <a href="/">AutoResearch-CyberLab</a>
  {% if me %}<nav><a href="/">Studies</a><a href="/projects/new">New study</a>{% if me.is_admin %}<a href="/admin">Admin</a>{% endif %}<a href="/logout">Sign out ({{ me.username }})</a></nav>{% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
